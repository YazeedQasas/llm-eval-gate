name: llm-eval-gate
description: >-
  Offline regression gate for LLM systems. Replays recorded outputs, runs leakage
  guards, scores them deterministically and fails when the primary score regresses
  against a frozen baseline.
branding:
  icon: shield
  color: red

inputs:
  config:
    description: Path to evalgate.toml.
    default: evalgate.toml
  prompt:
    description: Optional prompt file to check instead of the one in the config.
    default: ""
  python-version:
    description: Python version used to run evalgate.
    default: "3.12"

outputs:
  report:
    description: Path to the markdown report.
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install evalgate
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: evalgate check
      id: check
      shell: bash
      env:
        EVALGATE_CONFIG: ${{ inputs.config }}
        EVALGATE_PROMPT: ${{ inputs.prompt }}
      run: |
        report="$RUNNER_TEMP/evalgate-report.md"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        args=(check --config "$EVALGATE_CONFIG" --report "$report")
        if [ -n "$EVALGATE_PROMPT" ]; then args+=(--prompt "$EVALGATE_PROMPT"); fi
        evalgate "${args[@]}"
